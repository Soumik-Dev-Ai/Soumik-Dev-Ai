name: Update profile stats

on:
  schedule:
    - cron: "20 5 * * *"   # daily at 05:20 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install Pillow

      - name: Generate portrait
        run: python scripts/make_portrait.py

      - name: Generate headings
        run: python scripts/generate_headings.py

      - name: Generate stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: Hack-master22
        run: python scripts/generate_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A '*.svg'
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "chore: update generated SVGs"
          git push
